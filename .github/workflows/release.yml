name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        # --include=dev ensures devDependencies are installed even when
        # npm's global config has omit=dev set (can happen in some CI
        # environments or when the user's npm config leaks in).
        run: npm ci --include=dev

      - name: Check version consistency
        run: npm run check:version

      - name: Run lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check JSDoc types
        run: npm run check:types

      - name: Run tests
        run: npm test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use OIDC-capable npm
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Check version consistency
        run: npm run check:version

      - name: Check README claim drift
        run: npm run check:claims:quick

      - name: Check for credential leaks
        run: npm run check:secrets

      - name: Check package content
        run: npm run check:package

      - name: Audit production dependencies
        run: npm audit --audit-level=moderate --omit=dev

      - name: Check publish tree
        run: npm run check:publish-tree

      - name: Publish to npm with trusted publishing
        # Requires a one-time npm trusted-publisher relationship for
        # jbdrak/propprofessor-mcp + release.yml. No long-lived NPM_TOKEN.
        run: npm publish

      - name: Create GitHub release
        # Only after npm publish succeeds, so a failed publish never
        # leaves an orphan GitHub release.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
