name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # --include=dev ensures devDependencies are installed even when
        # npm's global config has omit=dev set (can happen in some CI
        # environments or when the user's npm config leaks in).
        run: npm ci --include=dev

      - name: Check version consistency
        run: npm run check:version

      - name: Check README claim drift
        # Fails the build if README's "N tools" / "M tests passing" claim
        # drifts from the actual codebase. Catches the silent-rot class
        # of bugs (phantom tools, stale test counts) before they ship.
        run: npm run check:claims:quick

      - name: Check for credential leaks
        # Fails if auth.json, token-cache.json, or .propprofessor/ are ever
        # committed. Belt-and-suspenders alongside .gitignore.
        run: npm run check:secrets

      - name: Run lint
        run: npm run lint

      - name: Check JSDoc types (informational, not a gate)
        # Type-check files opted into tsconfig.json's `include` list. The
        # check currently has many pre-existing errors (mostly in screen-ranker,
        # api, auth, formatter) that are out of scope for the audit. The plan
        # is to fix them in a follow-up task and re-enable the gate then.
        # For now we just print the errors so they're visible in CI logs.
        run: npm run check:types || echo "::warning::tsc has pre-existing errors; see audit follow-up"

      - name: Check for circular dependencies
        # Substitutes for the blocked `eslint-plugin-import/no-cycle` rule
        # (waiting on upstream support for ESLint 10). madge runs as a
        # standalone tool and exits non-zero on any cycle.
        run: npm run check:circular

      - name: Check formatting
        run: npm run format:check

      - name: Audit dependencies
        # `npm audit` surfaces known CVEs in the dependency tree. We use the
        # `audit-level=moderate` threshold so we don't fail on dev-time
        # advisories, but do catch anything that would actually ship to users.
        # Production deps (got-scraping, superjson, playwright) are the
        # primary concern; dev deps (eslint, prettier, c8) rarely need
        # security gating.
        run: npm audit --audit-level=moderate --omit=dev

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
        shard: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run tests (shard ${{ matrix.shard }}/3)
        # Sharding the 1666 tests across 3 runners cuts wall-clock time
        # from ~190s to ~65s per shard. fail-fast: false on the matrix
        # means one flaky shard won't cancel the others.
        run: node --test --test-shard=${{ matrix.shard }}/3 test/*.test.js
